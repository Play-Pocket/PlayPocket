<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <title>PlayPocket Installer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="app-shell">
    <header class="topbar card">
      <div class="brand">
        <img id="heroIcon" class="logo-img" alt="PlayPocket" />
        <div class="brand-copy">
          <p class="eyebrow">PlayPocket Installer</p>
          <h1>PlayPocket をインストール</h1>
          <p class="subline">PlayPocketのインストール・更新・修復・アンインストール</p>
        </div>
      </div>
    </header>

    <section class="card main-panel">
      <div class="panel-header">
        <div>
          <p class="section-label">インストール先</p>
          <h2>PlayPocketのインストール先</h2>
        </div>
        <div id="statusText" class="status-badge">準備中</div>
      </div>

      <div class="dir-card">
        <div class="dir-head">
          <div>
            <p class="dir-title">保存先フォルダ</p>
            <p class="dir-desc">既定で通常のアプリが入る場所を選択済み</p>
          </div>
          <button id="browseInstall" class="btn btn-ghost" type="button">変更</button>
        </div>
        <div class="input-row">
          <input id="installDir" type="text" spellcheck="false" />
          <button id="openInstall" class="btn btn-ghost" type="button">開く</button>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-head">
          <div id="progressTitle">待機中</div>
          <div id="progressPercent">0%</div>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressDetail" class="progress-detail">操作を開始すると進捗が表示されます。</div>
      </div>

      <div class="action-grid">
        <button id="installBtn" class="btn btn-primary" type="button">インストール</button>
        <button id="updateBtn" class="btn btn-secondary" type="button">アップデート</button>
        <button id="repairBtn" class="btn btn-secondary" type="button">修復</button>
        <button id="uninstallBtn" class="btn btn-danger" type="button">アンインストール</button>
      </div>
    </section>
  </main>

  <script src="./renderer.js"></script>
</body>
</html>
